<!doctype html><html lang="nb"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Panelkalkulator</title><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#16834b"><link rel="apple-touch-icon" href="icon-192.png"><style>body{font-family:system-ui;margin:0;background:#f3f5f4;color:#17211b}.box{max-width:520px;margin:24px auto;padding:22px;background:white;border-radius:18px;box-shadow:0 3px 16px #0002}h1{margin:0 0 6px}label{display:block;font-weight:700;margin-top:18px}input,button{box-sizing:border-box;width:100%;padding:14px;font-size:18px;border-radius:10px}input{border:1px solid #aaa;margin-top:6px}button{margin-top:20px;border:0;background:#16834b;color:white;font-weight:800}.out{margin-top:20px;padding:18px;background:#e9f8ef;border:1px solid #62c487;border-radius:12px}.big{font-size:26px;font-weight:800}.note{font-size:13px;color:#536159}</style></head><body><main class="box"><h1>🔨 Panelkalkulator</h1><p>Lik inndeling i begge ender, uten unødvendig smale kantbord.</p><label for="w">Veggbredde (mm)</label><input id="w" type="number" inputmode="decimal" value="4380" min="1"><label for="b">Dekkbredde panel (mm)</label><input id="b" type="number" inputmode="decimal" value="123" min="0.1" step="0.1"><button onclick="calc()">BEREGN</button><div id="o" class="out"></div><p class="note">Bruk faktisk dekkbredde på panelet. Kontrollmål veggen før kapping.</p></main><script>function n(x){return(Math.round(x*10)/10).toLocaleString('nb-NO')+' mm'}function calc(){let w=+document.getElementById('w').value,b=+document.getElementById('b').value,o=document.getElementById('o');if(!(w>0&&b>0)||b>w){o.textContent='Skriv inn gyldige mål.';return}let f=Math.floor(w/b),r=w-f*b,e=r/2;if(r<.001){e=b;f=Math.max(0,f-2)}else if(e<b/2&&f>0){r+=b;f--;e=r/2}o.innerHTML='<div>Startbord</div><div class="big">'+n(e)+'</div><div style="margin-top:12px">Sluttbord</div><div class="big">'+n(e)+'</div><div style="margin-top:14px"><b>'+f+'</b> hele bord mellom</div>'}calc()</script><script>if ('serviceWorker' in navigator) { window.addEventListener('load', () => navigator.serviceWorker.register('./service-worker.js')); }</script></body></html>
